<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="930" viewBox="0 0 1600 930" role="img" aria-labelledby="title desc">
  <title id="title">DROID-SLAM baseline and proposed visual inertial extension</title>
  <desc id="desc">One diagram distinguishes retained original DROID modules in blue from newly added IMU modules in orange, two-stage visual inertial optimization in green, and learned confidence in purple.</desc>
  <defs>
    <style>
      .title { font: 700 35px Arial, 'Noto Sans KR', sans-serif; fill: #18212f; }
      .subtitle { font: 500 18px Arial, 'Noto Sans KR', sans-serif; fill: #52616b; }
      .section { font: 700 22px Arial, 'Noto Sans KR', sans-serif; fill: #18212f; }
      .head { font: 700 19px Arial, 'Noto Sans KR', sans-serif; fill: #18212f; }
      .body { font: 500 16px Arial, 'Noto Sans KR', sans-serif; fill: #243547; }
      .small { font: 500 14px Arial, 'Noto Sans KR', sans-serif; fill: #52616b; }
      .label { font: 700 14px Arial, 'Noto Sans KR', sans-serif; fill: #ffffff; }
      .node { stroke-width: 2; rx: 13; ry: 13; }
      .blue { fill: #e8f1ff; stroke: #3e7bca; }
      .orange { fill: #fff1de; stroke: #d8872c; }
      .green { fill: #edf9f1; stroke: #3f9f67; }
      .purple { fill: #f4edff; stroke: #8a60c7; }
      .output { fill: #f5f7fa; stroke: #6d7c89; }
      .frameblue { fill: #f8fbff; stroke: #3e7bca; stroke-width: 2.5; stroke-dasharray: 10 7; }
      .framegreen { fill: #fbfffc; stroke: #3f9f67; stroke-width: 2.5; }
      .av { fill: none; stroke: #3e7bca; stroke-width: 3; marker-end: url(#bluearrow); }
      .ai { fill: none; stroke: #d8872c; stroke-width: 3; marker-end: url(#orangearrow); }
      .ag { fill: none; stroke: #3f9f67; stroke-width: 3; marker-end: url(#greenarrow); }
      .ap { fill: none; stroke: #8a60c7; stroke-width: 3; marker-end: url(#purplearrow); }
      .dashp { fill: none; stroke: #8a60c7; stroke-width: 2.7; stroke-dasharray: 8 7; marker-end: url(#purplearrow); }
    </style>
    <marker id="bluearrow" markerWidth="11" markerHeight="11" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#3e7bca"/></marker>
    <marker id="orangearrow" markerWidth="11" markerHeight="11" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#d8872c"/></marker>
    <marker id="greenarrow" markerWidth="11" markerHeight="11" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#3f9f67"/></marker>
    <marker id="purplearrow" markerWidth="11" markerHeight="11" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#8a60c7"/></marker>
  </defs>

  <rect width="1600" height="930" fill="#ffffff"/>
  <text x="800" y="54" text-anchor="middle" class="title">원본 DROID-SLAM을 유지한 Two-stage Visual–Inertial 확장</text>
  <text x="800" y="84" text-anchor="middle" class="subtitle">파란색은 유지한 DROID baseline, 색상 블록은 이번 프로젝트에서 추가·확장한 부분</text>

  <!-- Original DROID visual backbone frame -->
  <rect x="42" y="128" width="935" height="350" rx="22" class="frameblue"/>
  <rect x="67" y="109" width="285" height="38" rx="12" fill="#3e7bca"/>
  <text x="210" y="135" text-anchor="middle" class="label">원본 DROID-SLAM: 유지한 visual backbone</text>

  <rect x="76" y="207" width="130" height="78" class="node blue"/>
  <text x="141" y="239" text-anchor="middle" class="head">단안 이미지</text>
  <text x="141" y="262" text-anchor="middle" class="small">10 Hz</text>

  <rect x="253" y="195" width="145" height="102" class="node blue"/>
  <text x="326" y="232" text-anchor="middle" class="head">FNet / CNet</text>
  <text x="326" y="256" text-anchor="middle" class="small">feature / context</text>

  <rect x="447" y="195" width="160" height="102" class="node blue"/>
  <text x="527" y="232" text-anchor="middle" class="head">Correlation</text>
  <text x="527" y="256" text-anchor="middle" class="small">matching feature</text>

  <rect x="657" y="195" width="150" height="102" class="node blue"/>
  <text x="732" y="232" text-anchor="middle" class="head">ConvGRU</text>
  <text x="732" y="256" text-anchor="middle" class="small">반복 update feature</text>

  <path d="M206 246 H253 M398 246 H447 M607 246 H657" class="av"/>

  <rect x="269" y="351" width="215" height="78" class="node blue"/>
  <text x="376" y="383" text-anchor="middle" class="head">Visual update head</text>
  <text x="376" y="407" text-anchor="middle" class="small">correspondence Δ, visual Wᵛ</text>

  <rect x="554" y="351" width="250" height="78" class="node blue"/>
  <text x="679" y="383" text-anchor="middle" class="head">Dense Visual BA</text>
  <text x="679" y="407" text-anchor="middle" class="small">pose + inverse depth</text>
  <path d="M732 297 C732 331, 595 315, 484 380" class="av"/>
  <path d="M484 390 H554" class="av"/>

  <!-- Added learned confidence branch -->
  <rect x="1035" y="130" width="510" height="160" rx="22" fill="#fcfaff" stroke="#cdb8ed" stroke-width="2"/>
  <rect x="1058" y="112" width="260" height="38" rx="12" fill="#8a60c7"/>
  <text x="1188" y="138" text-anchor="middle" class="label">추가 ① DVI-style confidence head</text>
  <rect x="1070" y="179" width="195" height="76" class="node purple"/>
  <text x="1168" y="211" text-anchor="middle" class="head">1×1 Conv + 평균 pooling</text>
  <text x="1168" y="234" text-anchor="middle" class="small">ConvGRU hidden feature 입력</text>
  <rect x="1320" y="179" width="185" height="76" class="node purple"/>
  <text x="1413" y="211" text-anchor="middle" class="head">learned confidence wᵘ</text>
  <text x="1413" y="234" text-anchor="middle" class="small">각 IMU factor: 0 ~ 1</text>
  <path d="M1265 217 H1320" class="ap"/>
  <path d="M807 246 C925 246, 927 217, 1070 217" class="dashp"/>

  <!-- Preintegration -->
  <rect x="42" y="550" width="470" height="230" rx="22" fill="#fffcf8" stroke="#efbc7e" stroke-width="2"/>
  <rect x="67" y="531" width="270" height="38" rx="12" fill="#d8872c"/>
  <text x="202" y="557" text-anchor="middle" class="label">추가 ② IMU preintegration</text>
  <rect x="83" y="620" width="145" height="82" class="node orange"/>
  <text x="156" y="652" text-anchor="middle" class="head">Gyro + Accel</text>
  <text x="156" y="676" text-anchor="middle" class="small">고주파 IMU sample</text>
  <rect x="282" y="600" width="185" height="122" class="node orange"/>
  <text x="375" y="634" text-anchor="middle" class="head">Preintegration</text>
  <text x="375" y="660" text-anchor="middle" class="small">ΔR, Δv, Δp</text>
  <text x="375" y="683" text-anchor="middle" class="small">covariance, bias Jacobian</text>
  <path d="M228 661 H282" class="ai"/>

  <!-- Two-stage extension frame -->
  <rect x="574" y="516" width="971" height="292" rx="22" class="framegreen"/>
  <rect x="598" y="497" width="330" height="38" rx="12" fill="#3f9f67"/>
  <text x="763" y="523" text-anchor="middle" class="label">추가 ③ Two-stage 15DoF VIO</text>

  <rect x="614" y="591" width="198" height="116" class="node green"/>
  <text x="713" y="625" text-anchor="middle" class="head">Stage 1: visual warm-up</text>
  <text x="713" y="650" text-anchor="middle" class="small">기존 Dense Visual BA 사용</text>
  <text x="713" y="674" text-anchor="middle" class="small">relative pose / depth 안정화</text>

  <rect x="872" y="580" width="235" height="138" class="node green"/>
  <text x="990" y="616" text-anchor="middle" class="head">VI alignment</text>
  <text x="990" y="642" text-anchor="middle" class="small">scale, gravity, velocity</text>
  <text x="990" y="665" text-anchor="middle" class="small">accel/gyro bias 초기화</text>
  <text x="990" y="690" text-anchor="middle" class="small">visual trajectory + IMU</text>

  <rect x="1169" y="567" width="318" height="164" class="node green"/>
  <text x="1328" y="604" text-anchor="middle" class="head">Stage 2: full 15DoF DBA</text>
  <text x="1328" y="634" text-anchor="middle" class="small">pose(6) + velocity(3)</text>
  <text x="1328" y="657" text-anchor="middle" class="small">accel bias(3) + gyro bias(3)</text>
  <text x="1328" y="685" text-anchor="middle" class="small">visual reprojection + IMU factor</text>
  <path d="M812 649 H872" class="ag"/>
  <path d="M1107 649 H1169" class="ag"/>
  <path d="M467 661 C625 661, 675 695, 872 695" class="ai"/>
  <path d="M679 429 C679 521, 695 525, 695 591" class="av"/>
  <path d="M1413 255 C1413 390, 1450 436, 1413 567" class="dashp"/>
  <text x="1492" y="418" text-anchor="end" class="small" fill="#8a60c7">IMU residual 가중치 조절</text>

  <!-- Output -->
  <rect x="1169" y="840" width="318" height="60" class="node output"/>
  <text x="1328" y="865" text-anchor="middle" class="head">Metric trajectory + dense reconstruction</text>
  <text x="1328" y="886" text-anchor="middle" class="small">최종 출력</text>
  <path d="M1328 731 V840" class="ag"/>

  <!-- Legend -->
  <rect x="52" y="846" width="720" height="54" rx="12" fill="#f5f7fa"/>
  <rect x="76" y="865" width="20" height="20" rx="4" fill="#e8f1ff" stroke="#3e7bca" stroke-width="2"/>
  <text x="105" y="881" class="small">파란색: 원본 DROID-SLAM에서 유지</text>
  <rect x="320" y="865" width="20" height="20" rx="4" fill="#fff1de" stroke="#d8872c" stroke-width="2"/>
  <text x="349" y="881" class="small">주황색: IMU 처리 추가</text>
  <rect x="522" y="865" width="20" height="20" rx="4" fill="#edf9f1" stroke="#3f9f67" stroke-width="2"/>
  <text x="551" y="881" class="small">초록색: VIO 최적화 추가</text>
  <rect x="706" y="865" width="20" height="20" rx="4" fill="#f4edff" stroke="#8a60c7" stroke-width="2"/>
  <text x="735" y="881" class="small">보라색: 학습 confidence 추가</text>
</svg>
