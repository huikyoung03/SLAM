<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">실험 1: IMU 초기화-only 구조</title>
  <desc id="desc">DROID의 online local visual DBA가 만든 잠정 궤적과 IMU preintegration을 정렬하여 scale, gravity, velocity, bias를 초기화한다. 이후 IMU factor를 DBA에 넣지 않으므로 visual-only DBA가 계속 수행되는 개념 대조군이다.</desc>
  <defs>
    <marker id="arrow" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto">
      <path d="M0,0 L10,5.5 L0,11 z" fill="#425466"/>
    </marker>
    <marker id="arrowBlue" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto">
      <path d="M0,0 L10,5.5 L0,11 z" fill="#2563eb"/>
    </marker>
    <marker id="arrowOrange" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto">
      <path d="M0,0 L10,5.5 L0,11 z" fill="#d97706"/>
    </marker>
    <style>
      .bg { fill:#ffffff; }
      .title { font-family:'Noto Sans KR','Malgun Gothic',sans-serif; font-size:38px; font-weight:800; fill:#172033; }
      .subtitle { font-family:'Noto Sans KR','Malgun Gothic',sans-serif; font-size:19px; font-weight:500; fill:#526170; }
      .section { font-family:'Noto Sans KR','Malgun Gothic',sans-serif; font-size:17px; font-weight:800; letter-spacing:.4px; }
      .boxTitle { font-family:'Noto Sans KR','Malgun Gothic',sans-serif; font-size:23px; font-weight:800; fill:#172033; }
      .boxText { font-family:'Noto Sans KR','Malgun Gothic',sans-serif; font-size:17px; font-weight:500; fill:#334155; }
      .small { font-family:'Noto Sans KR','Malgun Gothic',sans-serif; font-size:15px; font-weight:600; fill:#526170; }
      .tiny { font-family:'Noto Sans KR','Malgun Gothic',sans-serif; font-size:14px; font-weight:600; fill:#64748b; }
      .note { font-family:'Noto Sans KR','Malgun Gothic',sans-serif; font-size:18px; font-weight:700; fill:#9a3412; }
      .badge { font-family:'Noto Sans KR','Malgun Gothic',sans-serif; font-size:15px; font-weight:800; fill:#ffffff; }
    </style>
  </defs>

  <rect class="bg" width="1600" height="900"/>
  <rect x="55" y="42" width="12" height="70" rx="6" fill="#2563eb"/>
  <text x="88" y="78" class="title">실험 1. IMU 초기화-only: 정확한 처리 순서</text>
  <text x="88" y="108" class="subtitle">최종 BA가 끝난 뒤 정렬하는 것이 아니라, online local visual DBA의 잠정 상태를 이용해 정렬한 뒤에도 visual BA는 계속된다.</text>

  <!-- Stage labels -->
  <text x="95" y="180" class="section" fill="#2563eb">A. IMU 없이 visual state를 안정화</text>
  <text x="650" y="180" class="section" fill="#d97706">B. 관측 가능해진 시점에 VI alignment</text>
  <text x="1175" y="180" class="section" fill="#2563eb">C. 이후에도 visual-only DBA</text>

  <!-- Inputs -->
  <rect x="90" y="230" width="215" height="105" rx="16" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/>
  <rect x="108" y="247" width="52" height="30" rx="15" fill="#2563eb"/>
  <text x="121" y="268" class="badge">CAM</text>
  <text x="177" y="269" class="boxTitle">Image stream</text>
  <text x="108" y="304" class="small">monocular image, 10 Hz</text>

  <rect x="90" y="426" width="215" height="105" rx="16" fill="#fff7ed" stroke="#fdba74" stroke-width="2"/>
  <rect x="108" y="443" width="52" height="30" rx="15" fill="#d97706"/>
  <text x="121" y="464" class="badge">IMU</text>
  <text x="177" y="465" class="boxTitle">IMU stream</text>
  <text x="108" y="500" class="small">gyro + accelerometer</text>

  <!-- visual ba -->
  <line x1="305" y1="282" x2="372" y2="282" stroke="#2563eb" stroke-width="4" marker-end="url(#arrowBlue)"/>
  <rect x="382" y="210" width="245" height="150" rx="18" fill="#eff6ff" stroke="#60a5fa" stroke-width="3"/>
  <rect x="403" y="229" width="108" height="28" rx="14" fill="#dbeafe"/>
  <text x="420" y="249" class="small" fill="#1d4ed8">반복 수행</text>
  <text x="403" y="290" class="boxTitle">DROID local visual DBA</text>
  <text x="403" y="320" class="boxText">feature · correlation · ConvGRU</text>
  <text x="403" y="345" class="boxText">visual reprojection residual만 사용</text>

  <!-- preintegration -->
  <line x1="305" y1="478" x2="372" y2="478" stroke="#d97706" stroke-width="4" marker-end="url(#arrowOrange)"/>
  <rect x="382" y="406" width="245" height="145" rx="18" fill="#fff7ed" stroke="#fb923c" stroke-width="3"/>
  <text x="403" y="454" class="boxTitle">IMU preintegration</text>
  <text x="403" y="485" class="boxText">프레임 사이 ΔR, Δv, Δp</text>
  <text x="403" y="511" class="boxText">여기서는 정렬 입력으로만 사용</text>

  <!-- visual output -->
  <line x1="627" y1="285" x2="684" y2="285" stroke="#425466" stroke-width="3.5" marker-end="url(#arrow)"/>
  <text x="486" y="390" class="tiny">잠정 relative pose · inverse depth</text>
  <line x1="627" y1="478" x2="684" y2="478" stroke="#425466" stroke-width="3.5" marker-end="url(#arrow)"/>

  <!-- alignment -->
  <rect x="695" y="246" width="390" height="250" rx="22" fill="#fff7ed" stroke="#f97316" stroke-width="4"/>
  <rect x="720" y="267" width="130" height="30" rx="15" fill="#f97316"/>
  <text x="740" y="288" class="badge">한 번 수렴 시</text>
  <text x="720" y="336" class="boxTitle">Visual–Inertial alignment</text>
  <text x="720" y="370" class="boxText">visual keyframe trajectory + IMU preintegration</text>
  <line x1="720" y1="390" x2="1054" y2="390" stroke="#fed7aa" stroke-width="2"/>
  <text x="720" y="424" class="boxText">추정: scale s, gravity g, velocity v, bias bₐ, bᵍ</text>
  <text x="720" y="456" class="small" fill="#9a3412">충분한 프레임·회전·이동 excitation 이후에만 실행</text>

  <!-- apply -->
  <line x1="1085" y1="370" x2="1143" y2="370" stroke="#d97706" stroke-width="4" marker-end="url(#arrowOrange)"/>
  <rect x="1153" y="296" width="335" height="150" rx="18" fill="#f0fdf4" stroke="#4ade80" stroke-width="3"/>
  <text x="1177" y="342" class="boxTitle">Metric initialization state</text>
  <text x="1177" y="375" class="boxText">pose / depth를 metric scale로 변환</text>
  <text x="1177" y="402" class="boxText">g, v, bₐ, bᵍ seed 저장</text>

  <!-- bottom continuation -->
  <line x1="1321" y1="446" x2="1321" y2="548" stroke="#2563eb" stroke-width="4" marker-end="url(#arrowBlue)"/>
  <rect x="1153" y="560" width="335" height="140" rx="18" fill="#eff6ff" stroke="#60a5fa" stroke-width="3"/>
  <text x="1177" y="607" class="boxTitle">DROID visual DBA 계속</text>
  <text x="1177" y="638" class="boxText">다음 keyframe에서도 visual residual만</text>
  <text x="1177" y="665" class="boxText">pose / depth를 갱신</text>

  <!-- forbidden path -->
  <path d="M632 540 C810 720 1010 760 1150 650" fill="none" stroke="#ef4444" stroke-width="4" stroke-dasharray="13 11"/>
  <line x1="916" y1="673" x2="945" y2="702" stroke="#ef4444" stroke-width="6"/>
  <line x1="945" y1="673" x2="916" y2="702" stroke="#ef4444" stroke-width="6"/>
  <text x="700" y="752" class="note">IMU residual / IMU factor는 DBA normal equation에 추가하지 않음</text>
  <text x="805" y="781" class="small">따라서 초기 scale seed는 얻지만, 이후 visual drift를 IMU로 수정할 수 없다.</text>

  <!-- footer -->
  <rect x="90" y="823" width="1398" height="2" fill="#e2e8f0"/>
  <text x="92" y="858" class="tiny">실험 1은 “초기화-only” 개념 대조군이다. 현재 구현은 안전장치상 VI initialization을 9DoF 또는 two-stage 15DoF IMU DBA와 함께 사용하도록 제한되어 있다.</text>
</svg>
