<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="920" viewBox="0 0 1600 920" role="img" aria-labelledby="title desc">
  <title id="title">Two-stage 15DoF DROID plus IMU architecture</title>
  <desc id="desc">Images pass through the original DROID visual backbone and a visual warm-up. IMU is preintegrated. Visual-IMU alignment initializes scale, gravity, velocity and biases. Full 15DoF DBA combines visual and inertial factors, weighted by a learned scalar confidence from ConvGRU features.</desc>
  <defs>
    <style>
      .title { font: 700 34px Arial, 'Noto Sans KR', sans-serif; fill: #18212f; }
      .subtitle { font: 500 17px Arial, 'Noto Sans KR', sans-serif; fill: #52616b; }
      .head { font: 700 21px Arial, 'Noto Sans KR', sans-serif; fill: #18212f; }
      .body { font: 500 17px Arial, 'Noto Sans KR', sans-serif; fill: #253447; }
      .small { font: 500 14px Arial, 'Noto Sans KR', sans-serif; fill: #52616b; }
      .tiny { font: 500 13px Arial, 'Noto Sans KR', sans-serif; fill: #52616b; }
      .node { stroke-width: 2; rx: 14; ry: 14; }
      .visual { fill: #e8f1ff; stroke: #4b84cf; }
      .imu { fill: #fff1de; stroke: #d98a31; }
      .vi { fill: #edf9f1; stroke: #43a36b; }
      .learned { fill: #f3ecff; stroke: #8b64c7; }
      .output { fill: #f5f7fa; stroke: #657583; }
      .arrow-v { fill: none; stroke: #4b84cf; stroke-width: 3; marker-end: url(#av); }
      .arrow-i { fill: none; stroke: #d98a31; stroke-width: 3; marker-end: url(#ai); }
      .arrow-g { fill: none; stroke: #43a36b; stroke-width: 3; marker-end: url(#ag); }
      .arrow-p { fill: none; stroke: #8b64c7; stroke-width: 3; marker-end: url(#ap); }
      .dash { fill: none; stroke: #8b64c7; stroke-width: 2.5; stroke-dasharray: 8 7; marker-end: url(#ap); }
    </style>
    <marker id="av" markerWidth="11" markerHeight="11" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#4b84cf"/></marker>
    <marker id="ai" markerWidth="11" markerHeight="11" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#d98a31"/></marker>
    <marker id="ag" markerWidth="11" markerHeight="11" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#43a36b"/></marker>
    <marker id="ap" markerWidth="11" markerHeight="11" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#8b64c7"/></marker>
  </defs>

  <rect width="1600" height="920" fill="#ffffff"/>
  <text x="800" y="55" text-anchor="middle" class="title">Final model: Two-stage 15DoF DROID + IMU</text>
  <text x="800" y="83" text-anchor="middle" class="subtitle">DVI-inspired scalar IMU confidence; original DROID visual backbone retained</text>

  <rect x="42" y="130" width="410" height="325" rx="20" fill="#f7faff" stroke="#bfd5f1" stroke-width="2"/>
  <text x="66" y="164" class="head">Visual path — retained DROID-SLAM</text>
  <rect x="78" y="198" width="135" height="72" class="node visual"/>
  <text x="145" y="230" text-anchor="middle" class="body">Camera images</text>
  <text x="145" y="252" text-anchor="middle" class="small">10 Hz input</text>
  <rect x="270" y="185" width="142" height="100" class="node visual"/>
  <text x="341" y="222" text-anchor="middle" class="body">FNet / CNet</text>
  <text x="341" y="246" text-anchor="middle" class="small">features + context</text>
  <path d="M213 234 H270" class="arrow-v"/>
  <rect x="78" y="336" width="155" height="76" class="node visual"/>
  <text x="156" y="368" text-anchor="middle" class="body">Correlation</text>
  <text x="156" y="390" text-anchor="middle" class="small">multi-scale matching</text>
  <rect x="270" y="325" width="142" height="98" class="node visual"/>
  <text x="341" y="360" text-anchor="middle" class="body">ConvGRU</text>
  <text x="341" y="383" text-anchor="middle" class="small">recurrent update</text>
  <text x="341" y="404" text-anchor="middle" class="small">hidden feature h</text>
  <path d="M341 285 V325" class="arrow-v"/>
  <path d="M233 374 H270" class="arrow-v"/>

  <rect x="492" y="130" width="350" height="325" rx="20" fill="#f7faff" stroke="#bfd5f1" stroke-width="2"/>
  <text x="516" y="164" class="head">Stage 1 — visual warm-up</text>
  <rect x="538" y="210" width="258" height="100" class="node visual"/>
  <text x="667" y="245" text-anchor="middle" class="body">Visual update heads</text>
  <text x="667" y="270" text-anchor="middle" class="small">correspondence Δ, visual Wᵛ</text>
  <rect x="538" y="345" width="258" height="72" class="node visual"/>
  <text x="667" y="376" text-anchor="middle" class="body">Dense visual BA</text>
  <text x="667" y="399" text-anchor="middle" class="small">relative pose + inverse depth</text>
  <path d="M412 374 H492" class="arrow-v"/>
  <path d="M667 310 V345" class="arrow-v"/>

  <rect x="42" y="525" width="410" height="272" rx="20" fill="#fffbf5" stroke="#f0c18a" stroke-width="2"/>
  <text x="66" y="559" class="head">IMU path — preintegration</text>
  <rect x="78" y="595" width="135" height="82" class="node imu"/>
  <text x="145" y="626" text-anchor="middle" class="body">Gyro + accel</text>
  <text x="145" y="650" text-anchor="middle" class="small">all high-rate samples</text>
  <rect x="270" y="579" width="142" height="114" class="node imu"/>
  <text x="341" y="614" text-anchor="middle" class="body">Preintegration</text>
  <text x="341" y="639" text-anchor="middle" class="small">ΔR, Δv, Δp</text>
  <text x="341" y="661" text-anchor="middle" class="small">covariance / Jᵦ</text>
  <path d="M213 636 H270" class="arrow-i"/>
  <text x="245" y="725" text-anchor="middle" class="tiny">IMU is not injected directly into ConvGRU.</text>

  <rect x="908" y="176" width="290" height="128" class="node vi"/>
  <text x="1053" y="212" text-anchor="middle" class="body">Visual–IMU alignment</text>
  <text x="1053" y="240" text-anchor="middle" class="small">initialize metric scale, gravity,</text>
  <text x="1053" y="262" text-anchor="middle" class="small">velocity, accel/gyro bias</text>
  <path d="M796 381 C858 381, 850 240, 908 240" class="arrow-g"/>
  <path d="M412 636 C700 636, 702 267, 908 267" class="arrow-i"/>

  <rect x="908" y="377" width="360" height="174" class="node vi"/>
  <text x="1088" y="417" text-anchor="middle" class="body">Stage 2 — full 15DoF VIO DBA</text>
  <text x="1088" y="447" text-anchor="middle" class="small">T (6) + velocity (3) + accel bias (3)</text>
  <text x="1088" y="470" text-anchor="middle" class="small">+ gyro bias (3), with dense inverse depth</text>
  <text x="1088" y="510" text-anchor="middle" class="small">visual reprojection + IMU preintegration factor</text>
  <path d="M1053 304 V377" class="arrow-g"/>
  <path d="M796 381 H908" class="arrow-v"/>
  <path d="M412 636 C694 636, 779 505, 908 505" class="arrow-i"/>

  <rect x="492" y="540" width="350" height="178" class="node learned"/>
  <text x="667" y="578" text-anchor="middle" class="body">DVI-style learned confidence head</text>
  <text x="667" y="610" text-anchor="middle" class="small">1×1 Conv: 128 → 1</text>
  <text x="667" y="634" text-anchor="middle" class="small">spatial average pooling + sigmoid</text>
  <text x="667" y="670" text-anchor="middle" class="body">scalar wᵘ ∈ [0, 1]</text>
  <path d="M341 423 C341 514, 481 580, 492 600" class="arrow-p"/>
  <path d="M842 630 C884 630, 855 555, 908 535" class="dash"/>
  <text x="837" y="663" text-anchor="middle" class="tiny">weights IMU factor only</text>

  <rect x="1320" y="412" width="230" height="110" class="node output"/>
  <text x="1435" y="449" text-anchor="middle" class="body">Output</text>
  <text x="1435" y="476" text-anchor="middle" class="small">metric trajectory</text>
  <text x="1435" y="498" text-anchor="middle" class="small">dense reconstruction</text>
  <path d="M1268 465 H1320" class="arrow-g"/>

  <rect x="58" y="840" width="1480" height="45" rx="12" fill="#f5f7fa"/>
  <text x="800" y="869" text-anchor="middle" class="small">Effective IMU influence = global prior weight (0.002) × learned confidence wᵘ × covariance-derived information</text>
</svg>
